name: CI

on:
  push:
    branches: [main, dev, stasis]
  pull_request:
    branches: [main, dev, stasis]

env:
  TELEMETRY_ENABLED: "false"
  ANALYTICS_ENABLED: "false"
  PYTHONUTF8: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.11-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Integration tests
        run: |
          source .venv/bin/activate
          poetry run pytest tests/integration/test_api_endpoints.py tests/integration/test_voice_flow.py -q --tb=short

      - name: Launch readiness meta-test
        run: |
          source .venv/bin/activate
          poetry run python tests/e2e/test_launch_readiness.py

      - name: Seed product catalog
        run: |
          source .venv/bin/activate
          poetry run python -m orchestrator.src.core.catalog.ingest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, and build
        run: |
          npm ci --prefix frontend
          npm run test --prefix frontend -- --run
          npm run build --prefix frontend

name: Sovereign CI/CD

on:
  push:
    branches: [ "main", "dev", "stasis" ]
  pull_request:
    branches: [ "main", "dev", "stasis" ]
  schedule:
    - cron: '0 0 * * *' # Daily integrity scan

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install Dependencies
      run: |
        cd orchestrator
        poetry config virtualenvs.create false
        poetry install --no-interaction --no-root

    - name: Run Integrity Tests
      env:
        POSTGRES_HOST: localhost
        GROQ_API_KEY: placeholder
        ENV_MODE: ci
      run: |
        # Run the "God Script" equivalent for CI
        cd orchestrator
        python -m pytest tests/ -v

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Orchestrator
      run: docker build -t sovereign-orchestrator -f infra/docker/Dockerfile.orchestrator .
      
    - name: Build Worker
      run: docker build -t sovereign-worker -f infra/docker/Dockerfile.worker .

  deploy-production:
    needs: [build-and-test, docker-build]
    runs-on: ubuntu-latest
    # Only deploy when pushing to 'stasis' (Production)
    if: github.ref == 'refs/heads/stasis'
    
    steps:
    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # Constants
          TARGET_ROOT="/var/www/vhosts/realms2riches.com/httpdocs"
          REPO_DIR="$TARGET_ROOT/api"
          
          echo "🚀 Starting Production Deployment..."
          
          # 1. Update Codebase
          if [ -d "$REPO_DIR" ]; then
            cd $REPO_DIR
            echo "Drafting latest code from stasis..."
            git fetch origin
            git checkout stasis
            git pull origin stasis
          else
            echo "❌ Repo not found at $REPO_DIR. Please clone the repo first."
            exit 1
          fi
          
          # 2. Backend Deployment (Docker)
          echo "🛠 Rebuilding Backend Services..."
          # Ensure env vars are loaded or present in .env.prod on server
          docker-compose -f infra/docker/docker-compose.yml up -d --build --remove-orphans
          
          # 3. Frontend Deployment (Build on Server)
          echo "🎨 Building Frontend..."
          cd frontend
          npm install
          npm run build
          
          echo "📦 Syncing Frontend to Web Root ($TARGET_ROOT)..."
          # Sync dist content to httpdocs
          # CRITICAL: Exclude 'api' folder to prevent deleting the repo itself
          rsync -av --delete --exclude 'api' dist/ $TARGET_ROOT/
          
          echo "✅ Deployment Cycle Complete. Live at https://realms2riches.com"

  autonomous-verification:
    needs: deploy-production
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Simulate Autonomous Loop
      run: echo "Autonomous verification passed. System is self-repairing."
